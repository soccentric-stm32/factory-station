[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hwval-factory"
version = "0.1.0"
description = "HWVAL Factory — bench tool for STM32F767ZI boards"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Sandesh Ghimire", email = "sandesh@soccentric.com" }]
dependencies = [
    "PySide6>=6.6",
    "pyserial>=3.5",
    "PyYAML>=6.0",
    "flatbuffers>=23.5",
    "cryptography>=41.0",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt", "ruff>=0.6", "mypy>=1.10", "flatbuffers>=23.5"]
packaging = ["pyinstaller>=6.6"]

[project.scripts]
hwval-factory = "hwval_factory.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hwval_factory = ["resources/*"]
hostcore = ["resources/*"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["src/hostcore/protocol/generated", "src/hostcore/vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Shared verbatim with the other SoCcentric GUIs; its noqa tags serve their rules.
"src/hostcore/soc_terminal.py" = ["RUF100", "SIM105"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = false
ignore_missing_imports = true
files = ["src"]
# Vendored wire code from HWVAL Studio and its simulator are checked by their
# own repository; typing them here would duplicate generated FlatBuffers code.
# soc_theme.py and soc_terminal.py are shared GUI files, byte-identical copies
# of the masters in bootloader-gui.
exclude = [
    "^src/hostcore/protocol/",
    "^src/hostcore/vendor/",
    "^src/hostcore/soc_theme.py$",
    "^src/hostcore/soc_terminal.py$",
    "^src/hostcore/simulator_device.py$",
    "^src/hostcore/test_catalogue.py$",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
