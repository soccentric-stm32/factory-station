# .gitlab-ci.yml - GitLab CI for HWVAL Factory (factory-station).
#
# Mirrors ./Jenkinsfile: Checkout -> Setup -> Lint -> Type check -> CLI smoke -> Tests ->
# Package -> Release (tags).
#
# Pure Python; the GUI never starts for real. Tests run headless with
# QT_QPA_PLATFORM=offscreen, and the package job needs PyInstaller.
#
# Set the CI/CD variable GITHUB_RELEASE_TOKEN (masked, protected) to
# publish a v<version> tag build as a GitHub release.

stages:
  - check
  - test
  - package
  - release

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH || $CI_COMMIT_TAG'

variables:
  GIT_DEPTH: "0"
  VENV: ".venv"
  QT_QPA_PLATFORM: "offscreen"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

default:
  image: python:3.12-slim
  interruptible: true
  before_script:
    - python3 --version
    - |
      python3 -m venv "$VENV"
    - |
      "$VENV/bin/python" -m pip install --upgrade pip
    - |
      "$VENV/bin/python" -m pip install -e ".[dev,packaging]"
    - |
      "$VENV/bin/python" -m pip list

lint:
  stage: check
  script:
    - |
      "$VENV/bin/python" -m ruff check src

typecheck:
  stage: check
  script:
    - |
      "$VENV/bin/python" -m mypy src
  allow_failure: true

smoke:
  stage: test
  script:
    - |
      "$VENV/bin/hwval-factory" --version

test:
  stage: test
  script:
    - |
      if [ -d tests ]; then
          "$VENV/bin/python" -m pytest
      else
          echo "tests: no tests/ directory yet - skipping pytest"
      fi

package:
  stage: package
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
  script:
    - |
      rm -rf dist
    - |
      "$VENV/bin/python" -m pip install -e ".[dev,packaging]"
    - |
      "$VENV/bin/python" -m pip wheel --no-deps --wheel-dir dist .
    - |
      "$VENV/bin/python" -m pip freeze > build-requirements.txt
    - |
      PATH="$PWD/$VENV/bin:$PATH" packaging/build-linux.sh
    - |
      python3 ci/package.py --name factory-station --version "$(ci/version.sh)" requirements.txt build-requirements.txt README.md LICENSE dist
  artifacts:
    paths:
      - dist/
    expire_in: 30 days

release:
  stage: release
  needs: [package]
  rules:
    - if: '$CI_COMMIT_TAG && $GITHUB_RELEASE_TOKEN'
  script:
    - |
      GITHUB_TOKEN="$GITHUB_RELEASE_TOKEN" python3 ci/github_release.py --tag "$CI_COMMIT_TAG" --version "$(ci/version.sh)" dist/*
