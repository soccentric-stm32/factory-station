# HWVAL Factory production station template.
# Copy outside the installation tree, fill in the ST-LINK serials, and never
# store secrets in the repository.
station:
  id: STN-01
  name: Line 1 EOL station
  line: L1

simulation: false
profiles_dir: /var/lib/hwval-factory/profiles
database: /var/lib/hwval-factory/hwval-factory.sqlite
labels_dir: /var/lib/hwval-factory/labels
certificates_dir: /var/lib/hwval-factory/certificates

fixtures:
  - name: F1
    probe_serial: "066BFF3031323334F1"
    serial_port: ""          # locate the VCP by the same ST-LINK serial
    telnet_port: 4444
    position: 0
    power: { driver: none }  # usb-hub: {location: "1-2", port: 1}
    debug_uart: ""           # optional USB-UART on PG14, e.g. /dev/serial/by-id/…
  - name: F2
    probe_serial: "066BFF3031323334F2"
    telnet_port: 4445
    position: 1
    power: { driver: none }
  - name: F3
    probe_serial: "066BFF3031323334F3"
    telnet_port: 4446
    position: 2
    power: { driver: none }
  - name: F4
    probe_serial: "066BFF3031323334F4"
    telnet_port: 4447
    position: 3
    power: { driver: none }

printer:
  enabled: true
  host: 192.168.1.50
  port: 9100
  queue: ""
  output_dir: /var/lib/hwval-factory/labels
  dpi: 203

mes:
  enabled: false
  endpoint: https://mes.example.invalid/api/runs
  token: ""
  timeout_s: 10
  max_attempts: 10
  backoff_s: 5

openocd:
  binary: openocd
  interface_cfg: interface/stlink.cfg
  target_cfg: target/stm32f7x.cfg
  telnet_base_port: 4444

security:
  session_timeout_minutes: 30
  retest_after_failures: 2
  self_test_interval_hours: 24
  maintenance_count: 10000
  require_profile_signature: false
  profile_public_key: ""   # base64 Ed25519 public key when signatures are required

# Optional shared serial/MAC pool for several stations (P4).  Leave the URL
# empty to use the local SQLite pool.
central_pool:
  url: ""          # postgresql://hwval:secret@db.example/hwval
  station_id: STN-01

kiosk: true
